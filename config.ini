; Read at build time and compiled into public/app.js; rebuild (nimble buildWeb) after editing.

[helpspot]

; HelpSpot base URL
url = "https://cbcsupport.helpspot.com"

; HelpSpot category ID (xCategory); leave empty to omit it
; 75 for CBC Support
; 76 for CGI Support
category = 75

; Reporting tags for HelpSpot requests
; Comma-separated list of tags to apply to HelpSpot requests
; reportingTags = ""
