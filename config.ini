; Read at build time and compiled into public/app.js; rebuild (nimble web) after editing.
[helpspot]
; HelpSpot request.create endpoint
url = https://cbcsupport.helpspot.com/api/index.php?method=request.create

; HelpSpot category (xCategory), given by name; leave empty to omit it
; 75 for CBC Support
; 76 for CGI Support
category = 75
